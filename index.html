<!doctype html>
<html lang="ko" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UI 이름 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;700;900&display=swap">
<style>
/* TOKENS — 바탕은 흰 · 검정, 포인트색은 시안 4개 중 하나(data-pal). --acc 는 선 · 표시, --acc-fill 은 그림 속 칠하는 면 */
:root{--bg:#FFFFFF;--card:#F4F6F9;--line:#E2E6EC;--fg:#12141A;--on-fg:#FFFFFF;--dim:#6B7280;--faint:#B6BCC6;--danger:#E5484D;--r:16px;
  --acc:#2F6BFF;--on-acc:#FFFFFF;--acc-fill:#A9C2FF;--acc-soft:rgba(47,107,255,.12)}
:root[data-pal="violet"]{--acc:#6D4AFF;--on-acc:#FFFFFF;--acc-fill:#C2B4FF;--acc-soft:rgba(109,74,255,.12)}
:root[data-pal="teal"]{--acc:#0E9F96;--on-acc:#FFFFFF;--acc-fill:#8FDDD6;--acc-soft:rgba(14,159,150,.12)}
:root[data-pal="lime"]{--card:#F4F4F2;--line:#E3E3E0;--fg:#1C1C1E;--acc:#1C1C1E;--on-acc:#D4F24A;--acc-fill:#D4F24A;--acc-soft:rgba(212,242,74,.3)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0D0F13;--card:#171A20;--line:#2A2F38;--fg:#EEF0F4;--on-fg:#0D0F13;--dim:#9AA1AE;--faint:#4A505B;--danger:#F0686C;
    --acc:#5B8CFF;--on-acc:#0D0F13;--acc-fill:#3157C8;--acc-soft:rgba(91,140,255,.16);color-scheme:dark}
  :root:not([data-theme="light"])[data-pal="violet"]{--acc:#9A82FF;--acc-fill:#5638D1;--acc-soft:rgba(154,130,255,.16)}
  :root:not([data-theme="light"])[data-pal="teal"]{--acc:#2CC4B9;--acc-fill:#0F7F78;--acc-soft:rgba(44,196,185,.16)}
  :root:not([data-theme="light"])[data-pal="lime"]{--acc:#D4F24A;--on-acc:#1C1C1E;--acc-fill:#8FA82A;--acc-soft:rgba(212,242,74,.16)}}
:root[data-theme="dark"]{--bg:#0D0F13;--card:#171A20;--line:#2A2F38;--fg:#EEF0F4;--on-fg:#0D0F13;--dim:#9AA1AE;--faint:#4A505B;--danger:#F0686C;
  --acc:#5B8CFF;--on-acc:#0D0F13;--acc-fill:#3157C8;--acc-soft:rgba(91,140,255,.16);color-scheme:dark}
:root[data-theme="dark"][data-pal="violet"]{--acc:#9A82FF;--acc-fill:#5638D1;--acc-soft:rgba(154,130,255,.16)}
:root[data-theme="dark"][data-pal="teal"]{--acc:#2CC4B9;--acc-fill:#0F7F78;--acc-soft:rgba(44,196,185,.16)}
:root[data-theme="dark"][data-pal="lime"]{--acc:#D4F24A;--on-acc:#1C1C1E;--acc-fill:#8FA82A;--acc-soft:rgba(212,242,74,.16)}
/* 예시 그림 속 포인트색은 어두운 화면에서도 밝은 화면 값으로 고정 (그림 바탕이 늘 밝아서) */
.th,.thc{--acc:#2F6BFF;--on-acc:#FFFFFF;--acc-fill:#A9C2FF;--acc-soft:rgba(47,107,255,.12)}
:root[data-pal="violet"] :is(.th,.thc){--acc:#6D4AFF;--acc-fill:#C2B4FF;--acc-soft:rgba(109,74,255,.12)}
:root[data-pal="teal"] :is(.th,.thc){--acc:#0E9F96;--acc-fill:#8FDDD6;--acc-soft:rgba(14,159,150,.12)}
:root[data-pal="lime"] :is(.th,.thc){--acc:#1C1C1E;--on-acc:#D4F24A;--acc-fill:#D4F24A;--acc-soft:rgba(212,242,74,.3)}
/* END TOKENS */
/* 레이아웃: 위 고정 머리 · 왼쪽 진열대(분류) · 가운데 상품 카드 · 오른쪽 장바구니(좁으면 서랍) */
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh,70px) + 6px)}
body{background:var(--bg);color:var(--fg);margin:0;font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1480px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;margin-right:4px;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--fg);display:grid;place-items:center}
.logo .mk i{width:12px;height:12px;border-radius:3px;background:var(--acc-fill)}
.logo b{font-size:17px;letter-spacing:-.02em}
.logo small{display:block;font-size:11.5px;color:var(--dim);font-weight:400;line-height:1.2}
.search{flex:1 1 240px;min-width:0;position:relative;max-width:520px}
.search input{width:100%;font:inherit;padding:10px 34px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);background:var(--bg)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--dim)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px ui-monospace,Consolas,monospace;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--bg)}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font-size:13px;border:0;background:transparent;color:var(--dim);padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button span{font-size:11px;margin-left:5px;opacity:.7;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg button:focus-visible,.btn:focus-visible,.add:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.pal{display:flex;gap:6px;align-items:center}
.pal button{width:18px;height:18px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.cartbtn{display:none;align-items:center;gap:8px;border:0;background:var(--fg);color:var(--on-fg);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px}
.cartbtn b{background:var(--acc-fill);color:var(--fg);border-radius:999px;min-width:20px;padding:0 6px;font-size:12px;text-align:center}

.shell{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding-block:24px 80px}
/* 왼쪽 진열대 */
.aisle{position:sticky;top:calc(var(--hh,70px) + 14px);align-self:start;max-height:calc(100vh - var(--hh,70px) - 30px);overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:4px}
.aisle::-webkit-scrollbar{display:none}
.aisle h3{font-size:11.5px;letter-spacing:.06em;color:var(--dim);margin:4px 0 10px 12px;font-weight:500}
.aisle button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:14px;color:var(--fg)}
.aisle button span{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.aisle button:hover{background:var(--card)}
.aisle button.on{background:var(--acc-soft);color:var(--fg);font-weight:700}
.aisle button.on span{color:var(--acc)}
.aisle button[disabled]{color:var(--faint);cursor:default;background:transparent}
.aisle .sup{font-size:12px;color:var(--dim);font-weight:600;padding:14px 12px 6px;margin-top:10px;border-top:1px solid var(--line)}
.aisle h3+.sup{margin-top:0;border-top:0;padding-top:0}
.supsec{margin-bottom:8px}
.suphead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13.5px;font-weight:600;padding:10px 2px 12px;margin:0 0 28px}
.suphead span{font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.aisle .tip{margin:14px 10px 0;font-size:12px;color:var(--dim);line-height:1.5}

/* 가운데 */
.meta{color:var(--dim);font-size:13px;margin:0 0 6px}
.catsec{margin-bottom:36px}
.catsec h2{font-size:20px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;font-weight:700;letter-spacing:-.02em}
.catsec h2 span{font-size:13px;color:var(--dim);font-weight:400}
.catsec p.cd{margin:0 0 14px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--cw,180px),100%),1fr));gap:24px 20px}
.catsec{margin-bottom:48px}
.card{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--fg) 25%,var(--line));box-shadow:0 6px 18px rgba(0,0,0,.06);transform:translateY(-1px)}
.card.in{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card .pic{border-radius:11px;overflow:hidden;background:var(--card)}
.card .pic .th{border-radius:0}
.card .body{padding:0 6px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.name{font-weight:700;min-width:0;letter-spacing:-.01em;font-size:16px;word-break:keep-all;overflow-wrap:anywhere}
.en{display:block;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--dim);font-weight:400;letter-spacing:0}
.desc{min-width:0;font-size:13.5px;color:color-mix(in srgb,var(--fg) 82%,var(--dim))}
.sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;font-size:12px;align-items:center;color:var(--dim)}
.tag{border:1px solid var(--line);color:var(--dim);padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;line-height:18px}
.tag.add2{border-color:color-mix(in srgb,var(--danger) 50%,var(--line));color:var(--danger)}
.vs{color:var(--fg);font-weight:500;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:2px}
.copy{border:0;background:none;color:var(--dim);cursor:pointer;padding:0;font-size:12px;margin-left:auto;text-decoration:underline;text-underline-offset:2px}
.copy:hover{color:var(--fg)}
.copy.done{color:var(--acc);text-decoration:none;font-weight:700}
.add{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.add:hover{border-color:var(--fg)}
.add svg{width:14px;height:14px}
.add.in{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{from{box-shadow:0 0 0 4px var(--acc)}to{box-shadow:0 0 0 4px transparent}}

/* 예시 그림 */
.th{display:block;width:100%;height:auto;aspect-ratio:16/10;background:var(--bg);border-radius:8px;overflow:hidden}
.th .g{fill:var(--line)} .th .f{fill:var(--faint)} .th .k{fill:var(--fg)} .th .w{fill:var(--bg)} .th .a{fill:var(--acc-fill)}
.th .x{fill:var(--danger)} .th .d{fill:#000;opacity:.38} .th .acs,.th .sga{fill:var(--acc-soft)} .th .ad{fill:var(--acc-fill);filter:brightness(.82)}
.th .fr{fill:var(--bg);stroke:var(--line);stroke-width:1.2} .th .fx{fill:var(--bg);stroke:var(--danger);stroke-width:1.6}
.th .sk,.th .sk3{fill:none;stroke:var(--fg)} .th .sa,.th .sa3{fill:none;stroke:var(--acc)} .th .sg{fill:none;stroke:var(--line)} .th .sw{fill:none;stroke:var(--on-fg)}
.th .sk2{fill:none;stroke:var(--fg);stroke-width:2} .th .sg2{fill:none;stroke:var(--line);stroke-width:10}
.th .tk{fill:var(--fg)} .th .tf{fill:var(--dim)} .th .tw{fill:var(--on-fg)} .th .tr{fill:var(--danger)}
.th text{font-family:inherit}
.thc{display:flex;align-items:center;justify-content:center;position:relative;font-size:26px;line-height:1.1;text-align:center}
.thc .smbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thc .sm{padding:9px 18px;font-size:13px}
.thc .tx{white-space:nowrap}
.thc>*{zoom:var(--z,1)}
.kin b{display:inline-block;animation:kin 1.4s ease-in-out infinite}
.kin b:nth-child(2){animation-delay:.08s}.kin b:nth-child(3){animation-delay:.16s}.kin b:nth-child(4){animation-delay:.24s}.kin b:nth-child(5){animation-delay:.32s}.kin b:nth-child(6){animation-delay:.4s}.kin b:nth-child(7){animation-delay:.48s}
@keyframes kin{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px) scaleY(1.15)}}

/* 이렇게 말하면 */
.phr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.p .say{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--danger);font-size:13.5px}
.p .to{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.p .to button{color:var(--fg);background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:3px}
.p .ex{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--card);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.p .ex span{min-width:0}
.empty{padding:40px 0;text-align:center;color:var(--dim)}

/* 오른쪽 장바구니 */
.cart{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden}
.cart .ch{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.cart .ch .t{display:flex;justify-content:space-between;align-items:center}
.cart .ch .t b{font-size:16px}
.cart .ch .t .x{border:0;background:none;cursor:pointer;color:var(--dim);display:none;padding:4px}
.screens{display:flex;gap:6px;flex-wrap:wrap}
.screens button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--dim)}
.screens button.on{background:var(--fg);border-color:var(--fg);color:var(--on-fg);font-weight:700}
.screens button.new{border-style:dashed}
.sname{display:flex;gap:6px}
.sname input{flex:1;min-width:0;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);color:var(--fg)}
.sname input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.sname button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 9px;cursor:pointer;color:var(--dim);font-size:12px}
.items{flex:1;overflow:auto;padding:4px 10px;display:flex;flex-direction:column;gap:6px;min-height:80px}
.it{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 8px 6px 6px}
.it .th{border:1px solid var(--line);border-radius:7px}
.it .thc{font-size:12px}.it .thc .sm{padding:2px 6px;font-size:8px}
.it .name{font-size:13.5px}
.it button{border:0;background:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px}
.it button:hover{color:var(--danger);background:var(--card)}
.cempty{color:var(--dim);font-size:13px;text-align:center;padding:24px 12px;border:1.5px dashed var(--line);border-radius:14px;margin:4px}
.cf{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn.pri{background:var(--fg);color:var(--on-fg)}
.btn.pri:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--dim);font-weight:500;padding:4px;font-size:12.5px}
.cf .preview{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim);white-space:pre-wrap;max-height:84px;overflow:auto;background:var(--bg);border-radius:10px;padding:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}

.foot{color:var(--dim);font-size:12px;margin-top:30px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--on-fg);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* 카드 크기 · 크게 보기 · 설명 말풍선 */
.card[data-key]{cursor:zoom-in}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.zoom{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.zoom button{width:28px;height:26px;border:0;background:transparent;border-radius:9px;cursor:pointer;display:grid;place-items:center;color:var(--fg);padding:0}
.zoom button:hover:not([disabled]){background:var(--bg)}
.zoom button[disabled]{opacity:.3;cursor:default}
.zoom svg{width:15px;height:15px}
.zoom span{font-size:11.5px;color:var(--dim);min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.dlg.view{gap:16px;background:rgba(10,12,20,.55);backdrop-filter:blur(6px);grid-template-columns:auto minmax(0,760px) auto;justify-content:center;align-items:center}
.dlg.view .dlgbox{width:100%;padding:18px 18px 22px;border-radius:24px}
.dlg.view .bigpic{position:relative;border-radius:16px;overflow:hidden;background:var(--card)}
.dlg.view .bigpic .th{border-radius:0}
.dlg.view .bigpic .pb{opacity:1}
.dlg.view .bighead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 6px 4px}
.dlg.view .bighead .name{font-size:36px;letter-spacing:-.02em;line-height:1.25}
.dlg.view .bigdesc{margin:12px 6px 6px;font-size:21px;line-height:1.6;color:color-mix(in srgb,var(--fg) 80%,var(--dim))}
.dlg.view .bighead .en{font-size:18px;margin-top:6px;color:color-mix(in srgb,var(--fg) 60%,var(--dim))}
.dlg.view .bighead .fav{width:48px;height:48px}.dlg.view .bighead .fav svg{width:28px;height:28px}
.dlg.view .dlgbox{outline:none}
.dlg.view .dlgbox>.x{position:sticky;top:6px;margin:0 6px -34px auto;z-index:2;background:rgba(255,255,255,.85);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:#12141A}
.dlg.view .nav{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.dlg.view .nav:hover{background:rgba(255,255,255,.26)}
.dlg.view .nav svg{width:22px;height:22px}
.tip{position:fixed;z-index:50;max-width:260px;background:var(--fg);color:var(--on-fg);border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .15s ease-out,transform .15s ease-out;box-shadow:0 8px 24px rgba(15,20,40,.18)}
.tip[data-up="1"]{transform:translateY(4px)}
.tip.in{opacity:1;transform:none}
.tip b{display:block;font-size:12px;margin-bottom:2px}
.tip::before{content:"";position:absolute;left:calc(var(--ax,50%) - 5px);top:-5px;width:10px;height:10px;background:inherit;transform:rotate(45deg);border-radius:2px}
.tip[data-up="1"]::before{top:auto;bottom:-5px}
@media (prefers-reduced-motion:reduce){.tip{transition:none}}
/* 즐겨찾기 별 */
.card .head{align-items:center}
.card .head:has(.nt){align-items:start}
